name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Capacitor Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install Node Dependencies
        run: npm install

      - name: Generate version.json before Web Build
        run: |
          RUN_NUM="${{ github.run_number }}"
          VERSION_CODE=$((100 + RUN_NUM))
          VERSION_NAME="1.0.${RUN_NUM}"
          BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          mkdir -p public
          cat << EOF > public/version.json
          {
            "versionName": "${VERSION_NAME}",
            "versionCode": ${VERSION_CODE},
            "buildTime": "${BUILD_TIME}",
            "downloadUrl": "https://github.com/PrimiasArt/Chill-reader/releases/download/android-apk-latest/ChillReader-v1.0.apk",
            "commit": "${{ github.sha }}",
            "releaseNotes": "Bản cập nhật tự động mới nhất qua GitHub Actions"
          }
          EOF
          cp public/version.json version.json

      - name: Build Web App (Vite)
        run: npm run build

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ChillReader-v1.0.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChillReader-v1.0-APK
          path: ChillReader-v1.0.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: android-apk-latest
          name: Chill Reader Android APK (Mới nhất)
          body: |
            ## 📱 Bản cài đặt Android APK (Chill Reader - Nâng cấp toàn diện)
            - **Chữ ký cố định (Persistent Keystore):** Giải quyết triệt để lỗi xung đột cài đè APK! Cập nhật trực tiếp mà không cần gỡ bản cũ, giữ nguyên 100% dữ liệu và cài đặt Supabase.
            - **Tính năng & Hiệu năng nâng cấp:**
              - 📱 **Giao diện Player chống tràn màn hình:** Tối ưu kích thước linh hoạt, cuộn mượt mà trên mọi kích thước màn hình Android.
              - ⚡ **Virtual Scrolling Mục lục:** Hiển thị mượt mà 3.000 - 10.000 chương đạt chuẩn 60 FPS, không còn giật lag DOM.
              - 📖 **Chế độ Lật trang (Paged Mode - Kindle) & Cuộn liên tục:** Tự động lật trang theo giọng đọc Audio TTS.
              - 🔄 **Tự động kiểm tra & cập nhật chương mới:** Nút cập nhật tức thì từ nguồn web online.
              - 🌧️ **Âm thanh nền thư giãn (Ambient Audio):** Phối âm tiếng mưa rơi, củi lửa tí tách, gió rừng trúc, suối nước thiên nhiên cùng giọng đọc.
              - 📳 **Lắc máy gia hạn hẹn giờ (Shake-to-Extend):** Lắc nhẹ điện thoại khi sắp hết giờ để nghe thêm 15 phút.
              - 🗣️ **Từ điển phát âm tuỳ chỉnh (Pronunciation Dictionary):** Sửa từ viết tắt, từ ngọng (ko ➔ không, main ➔ nhân vật chính,...).
              - 💾 **Tải Audio ngoại tuyến 1-click & Xuất file:** Tải trọn bộ audio cả chương để nghe offline, hỗ trợ xuất truyện ra định dạng EPUB & TXT.
              - 📜 **Sổ tay nhân vật & Cảnh giới tu tiên:** Ghi nhớ nhân vật, quan hệ, cấp độ tu luyện và pháp bảo.

            👉 Tải file **`ChillReader-v1.0.apk`** bên dưới và cài đặt trực tiếp vào điện thoại Android.
          files: |
            ChillReader-v1.0.apk
            version.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
