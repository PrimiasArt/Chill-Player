name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Capacitor Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web App (Vite)
        run: npm run build

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ChillReader-v1.0.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChillReader-v1.0-APK
          path: ChillReader-v1.0.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: android-apk-latest
          name: Chill Reader Android APK (Mới nhất)
          body: |
            ## 📱 Bản cài đặt Android APK (Chill Reader)
            - **Phiên bản:** Mới nhất (Capacitor Android)
            - **Tính năng mới & Sửa lỗi quan trọng:**
              - 🔊 **Audio TTS trên Android APK:** Sửa lỗi không phát được âm thanh trong app, cấp quyền âm thanh nền và mở khóa tự động phát liên tục qua từng câu.
              - ☁️ **Đồng bộ Supabase 2 chiều toàn diện:** Xóa truyện là xóa vĩnh viễn trên Cloud (không bị kéo lại truyện đã xóa), hỗ trợ đồng bộ toàn bộ nội dung chữ của các chương (`user_chapters`).
              - 📥 **Nút tải chương 1-click:** Khi mở truyện đồng bộ trên điện thoại chưa có chữ, người dùng có thể tải ngay từ Supabase Cloud hoặc tải trực tiếp từ nguồn web online.
              - 🎧 Đọc và nghe Audio TTS đa giọng (Nam Minh AI, Hoài My AI, Google).
              - ⚡ Tìm kiếm và nút "Đi nhanh" tới số chương trong Mục lục.
            
            👉 Tải file **`ChillReader-v1.0.apk`** bên dưới và cài đặt trực tiếp vào điện thoại Android.
          files: ChillReader-v1.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
