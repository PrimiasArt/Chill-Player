name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Capacitor Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install Node Dependencies
        run: npm install

      - name: Generate version.json before Web Build
        run: |
          RUN_NUM="${{ github.run_number }}"
          VERSION_CODE=$((100 + RUN_NUM))
          VERSION_NAME="1.0.${RUN_NUM}"
          BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          mkdir -p public
          cat << EOF > public/version.json
          {
            "versionName": "${VERSION_NAME}",
            "versionCode": ${VERSION_CODE},
            "buildTime": "${BUILD_TIME}",
            "downloadUrl": "https://github.com/PrimiasArt/Chill-reader/releases/download/android-apk-latest/ChillReader-v1.0.apk",
            "commit": "${{ github.sha }}",
            "releaseNotes": "Bản cập nhật v${VERSION_NAME} tự động qua GitHub Actions"
          }
          EOF
          cp public/version.json version.json

      - name: Build Web App (Vite)
        run: npm run build

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK with Gradle
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          cd android
          ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare APK outputs
        run: |
          RUN_NUM="${{ github.run_number }}"
          APK_SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK_SRC" ChillPlayer-v1.0.apk
          cp "$APK_SRC" "ChillPlayer-v1.0.${RUN_NUM}.apk"
          cp "$APK_SRC" ChillReader-v1.0.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChillPlayer-v1.0.${{ github.run_number }}-APK
          path: |
            ChillPlayer-v1.0.apk
            ChillPlayer-v1.0.${{ github.run_number }}.apk
            version.json
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: android-apk-latest
          name: Chill Player Android APK v1.0.${{ github.run_number }} (Mới nhất)
          body: |
            ## 📱 Bản cài đặt Android APK (Chill Player - Tự động tăng phiên bản)
            - **Phiên bản:** `1.0.${{ github.run_number }}` (VersionCode: `${{ github.run_number }}` + 100)
            - **Chữ ký cố định (Persistent Keystore):** Cài đè trực tiếp mà không cần gỡ bản cũ, giữ nguyên 100% dữ liệu sách offline và cài đặt đồng bộ Supabase Cloud.
            - **Tính năng nổi bật:**
              - 🎧 **Nghe truyện Audio TTS Tiếng Việt:** Đọc không quảng cáo, nhận diện giọng đọc chuẩn mực (Edge AI Neural, Google, Android Offline Native).
              - 📖 **Trải nghiệm đọc mượt mà:** Chế độ lật trang (Paged) & cuộn liên tục, chỉnh phông chữ, cỡ chữ, dãn dòng, theme Đen Amoled, Vàng Sepia, Ban đêm.
              - 📥 **Nạp file & Tự động phân chương:** Đọc file TXT, EPUB, PDF trực tiếp hoặc cào truyện online.
              - 🔄 **Tự động cập nhật 1 chạm (In-app Updater):** Ứng dụng tự động thông báo và tải bản mới nhất khi có build mới trên GitHub.

            👉 Tải file **`ChillPlayer-v1.0.apk`** bên dưới để cài đặt vào điện thoại Android.
          files: |
            ChillPlayer-v1.0.apk
            ChillPlayer-v1.0.${{ github.run_number }}.apk
            ChillReader-v1.0.apk
            version.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
